        function searchMajor() {

            const keyword =
            document.getElementById("majorInput").value.toLowerCase();

            let resultHTML = "";

            majors.forEach(major => {

                const matched = major.keywords.some(word =>
                    word.toLowerCase().includes(keyword)
                );

                if(keyword !== "" && matched){

                    resultHTML += `
                    <button onclick="showCard('${major.image}')">
                    ${major.name}
                    </button>

                    <br><br>
                    `;
                }

            });

            if(resultHTML === ""){

                resultHTML = `
                <div style="
                padding:15px;
                border:1px solid #666;
                border-radius:8px;
                margin-top:10px;
                ">
                🔍 검색 결과가 없습니다.<br><br>

                다른 학과명 또는 관심 키워드를 입력해보세요.

                </div>
                `;
            }

            document.getElementById("searchResults").innerHTML = resultHTML;

        }

        function toggleFAQ(id){

            const selectedFAQ = document.getElementById(id);

            const isOpen = selectedFAQ.style.display === "block";

            for(let i=1; i<=20; i++){

                const faq = document.getElementById("faq" + i);

                if(faq){
                    faq.style.display = "none";
                }

            }

            if(!isOpen){
                selectedFAQ.style.display = "block";
            }

        }
