<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>역탐현 작전사령부</title>

    <h1>⚔ MODERN WORLD OPERATIONS COMMAND</h1>

    <p><i>역사로 탐구하는 현대 세계 : 전쟁과 우리</i></p>

    <hr>

    <p>1945년 8월 15일.</p>

    <p>제2차 세계대전은 끝났다.</p>

    <p>그러나 우리는 앞으로의 현대세계를 대비해야 한다.</p>

    <br>

    <h2>OPERATION: DISCIPLINE × HISTORY</h2>

    <button onclick="showBriefing()">
        작전사령부 입장
    </button>

    <div id="briefing"></div>

    <div id="details"></div>

    <script>

        function showBriefing() {

            document.getElementById("briefing").innerHTML = `

            <hr>

            <h2>📜 작전 브리핑</h2>

            <p>단결! 안녕하십니까, 사령관님.</p>

            <p>
            1945년 8월 15일.
            제2차 세계대전은 끝났지만,
            현대세계는 이제 막 시작되었습니다.
            </p>

            <p>
            전쟁은 인문학, 자연과학,
            수학·공학, 사회과학,
            예체능 등 다양한 분야의
            급격한 발전을 이끌어냈습니다.
            </p>

            <p>
            그러나 우리는 아직도
            많은 질문에 답하지 못하고 있습니다.
            </p>

            <p>💻 컴퓨터는 왜 전쟁에서 탄생했을까?</p>

            <p>🌍 UN은 왜 만들어졌을까?</p>

            <p>☢ 원자력은 축복일까, 재앙일까?</p>

            <p>
            이에 우리 군은 각 학문의
            역사적 뿌리를 탐구하는
            'DISCIPLINE × HISTORY'
            작전을 최우선 과제로 지정하였습니다.
            </p>

            <p>
            작전 개시 시간은... 지금입니다!
            </p>

            <p>
            사령관님,
            어떤 작전에 병력을 투입하시겠습니까?
            </p>

            <hr>

            <h3>⚔ 작전 목록</h3>

            <button onclick="showHumanities()">
            📚 인문학 × 역사 융합 작전
            </button>

            <br><br>

            <button onclick="showScience()">
            🧪 자연과학 × 역사 융합 작전
            </button>

            <br><br>

            <button onclick="showEngineering()">
            ⚙ 수학·공학 × 역사 융합 작전
            </button>

            <br><br>

            <button onclick="showSocial()">
            🏛 사회과학 × 역사 융합 작전
            </button>

            <br><br>

            <button onclick="showArts()">
            🎨 예체능 × 역사 융합 작전
            </button>

            <br><br>

            <button onclick="showHistory()">
            📜 역사 심화 탐구 작전
            </button>

            `;
        }


        function showArts() {
            document.getElementById("details").innerHTML = `
            
            <h2>🎨 예체능 × 역사 융합 작전</h2>
            
            <button onclick="showCard('guernica_card.jpg')">
            
            🎨 피카소는 왜 게르니카를 그렸을까?

            </button>
                
            <br><br>
                
            <button onclick="showCard('music_card.jpg')">
            
           🎵 전쟁 이후 대중음악(POP)은 어떻게 발전했을까?
            
            </button>
            
            <br><br>
            
            <button onclick="showCard('movie_card.jpg')">
                
            🎬 영화는 전쟁에 어떻게 동원되었을까? - 디즈니의 프로파간다

            </button>
           
            <br><br>
           
            <button onclick="showCard('photo_card.jpg')">
            
            📷 사진은 역사를 기록할 수 있을까? - 로버트 카파(Robert Capa, 1913~1954)
            
            </button>
            
            <br><br>
            
            <button onclick="showCard('olympic_card.jpg')">
                
            🏅 올림픽은 정말 평화의 축제일까? -1936년 베를린 올림픽
            
            </button>
            
            <div id="card"></div>
            
            `;
        
        }

        function showCard(imageName) {

    
            document.getElementById("popup").style.display = "block";

    
            document.getElementById("popupContent").innerHTML = `

    
            <img
    
            src="images/${imageName}"
    
            style="
    
            width:100%;
    
            border-radius:10px;
    
            ">

    
            `;


        }


        function closePopup() {

    document.getElementById("popup").style.display = "none";

    }

       
        function showHumanities() {

        document.getElementById("details").innerHTML = `

            <h2>📚 인문학 × 역사 융합 작전</h2>

                <button onclick="showCard('propaganda_card.jpg')">
                📖 전체주의는 어떻게 사람들을 설득했을까?
                </button>

                <br><br>

                <button onclick="showCard('1984_card.jpg')">
                📚 『1984』는 왜 지금도 읽힐까?
                </button>

                <br><br>

                <button onclick="showCard('language_card.jpg')">
                🗣 전쟁은 언어를 어떻게 바꾸었을까?
                </button>

                <br><br>

                <button onclick="showCard('literature_card.jpg')">
                ✍ 전쟁 문학은 무엇을 기록하는가?
                </button>

                <br><br>

                <button onclick="showCard('humanrights_card.jpg')">
                ⚖ 인간은 왜 인권을 고민하게 되었을까?
                </button>

                `;

        }

        function showScience() {

            document.getElementById("details").innerHTML = `

            <h2>🧪 자연과학 × 역사 융합 작전</h2>

                <button onclick="showCard('nuclear_card.jpg')">
                ☢ 핵분열은 어떻게 발견되었을까?
                </button>

                <br><br>

                <button onclick="showCard('penicillin_card.jpg')">
                💊 페니실린은 어떻게 생명을 구했을까? 
                </button>

                <br><br>

                <button onclick="showCard('nylon_card.jpg')">
                🧵 나일론은 왜 전쟁의 필수품이 되었을까?
                </button>

                <br><br>

                <button onclick="showCard('body_card.jpg')">
                🧪 과학 발전은 윤리보다 중요할까?
                </button>

                <br><br>

                <button onclick="showCard('weather_card.jpg')">
                🌦 전쟁 중에 기상예측 기술은 왜 발전했을까? 
                </button>

                `;

        }

        function showEngineering() {

            document.getElementById("details").innerHTML = `

            <h2>⚙ 수학·공학 × 역사 융합 작전</h2>

                <button onclick="showCard('computer_card.jpg')">
                💻 컴퓨터는 왜 전쟁 중에 탄생했을까?
                </button>

                <br><br>

                <button onclick="showCard('enigma_card.jpg')">
                🔐 암호는 세상을 바꿀 수 있을까?
                </button>

                <br><br>

                <button onclick="showCard('radar_card.jpg')">
                📡 레이더는 전쟁을 어떻게 바꾸었을까?
                </button>

                <br><br>

                <button onclick="showCard('rocket_card.jpg')">
                🚀 V-2 로켓은 무엇을 남겼을까?
                </button>

                <br><br>

                <button onclick="showCard('medical_card.jpg')">
                🦿 전쟁은 의수·의족 기술을 어떻게 발전시켰을까?
                </button>

                <br><br>

                <button onclick="showCard('goliath_card.jpg')">
                🤖 무인무기는 언제부터 시작되었을까? - 골리아트
                </button>

                `;

        }

        function showSocial() {

            document.getElementById("details").innerHTML = `

            <h2>🏛 사회과학 × 역사 융합 작전</h2>

            <button onclick="showCard('un_card.jpg')">
            🌍 국제연합(UN)은 왜 만들어졌을까?
            </button>

            <br><br>

            <button onclick="showCard('propaganda_social_card.jpg')">
            📰 선전은 사람을 움직일 수 있을까?
            </button>

            <br><br>

            <button onclick="showCard('economy_card.jpg')">
            💰 전쟁은 경제를 성장시키는가?
            </button>

            <br><br>

            <button onclick="showCard('eichmann_card.jpg')">
            🧠 악의 평범성이란 무엇인가?
            </button>

            <br><br>

            <button onclick="showCard('democracy_card.jpg')">
            🏛 민주주의는 어떻게 승리했을까?
            </button>

            `;

        }

        function showHistory() {

            document.getElementById("details").innerHTML = `

            <h2>📜 역사 심화 탐구 작전</h2>

            <button onclick="showCard('hitler_card.jpg')">
            🧔 히틀러는 왜 집권할 수 있었을까?
            </button>

            <br><br>

            <button onclick="showCard('dictator_card.jpg')">
            ⚔ 전쟁은 정말 독재자 한 명 때문에 일어날까?
            </button>

            <br><br>

            <button onclick="showCard('winner_card.jpg')">
            📚 승자의 역사는 얼마나 믿을 수 있을까?
            </button>

            <br><br>

            <button onclick="showCard('memory_card.jpg')">
            🕯 기억은 어떻게 역사가 되는가?
            </button>

            <br><br>

            <button onclick="showCard('unfinishedwar_card.jpg')">
            🌏 제2차 세계대전은 아직 끝나지 않았는가?
            </button>

            `;

        }

    </script>

    <div id="popup"
    style="
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
    z-index:9999;
    overflow:auto;
    ">

    <div
    style="
    background:rgb(70, 67, 67);
    width:100%;
    max-width:1000px;
    margin:30px auto;
    padding:20px;
    border-radius:15px;
    position:relative;
    ">

    <button
    onclick="closePopup()"
    style="
    position:absolute;
    top:10px;
    right:10px;
    font-size:24px;
    padding:5px 10px;
    cursor:pointer;
    ">
    ✖
    </button>

    <div id="popupContent"></div>

    </div>

    </div>

</body>

</html>
