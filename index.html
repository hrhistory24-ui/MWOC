<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>역탐현 작전사령부</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="document">

        <header class="hero">
            <div class="declassified">DECLASSIFIED INTELLIGENCE FILE</div>
            <div class="stamp">TOP SECRET</div>

            <h1>MODERN WORLD OPERATIONS COMMAND</h1>
            <p class="subtitle">역사로 탐구하는 현대세계 : 전쟁과 우리</p>
        </header>

        <section class="opening-brief">
            <p>1945년 8월 15일.</p>
            <p>제2차 세계대전은 끝났다.</p>
            <p>그러나 우리는 앞으로의 현대세계를 대비해야 한다.</p>
            <p>(우측 하단에 bgm이 있습니다. bgm을 틀고 보시면 더욱 몰입하면서 즐길 수 있습니다!)</p>

            <h2>OPERATION: DISCIPLINE × HISTORY</h2>

            <button class="command-button primary" onclick="showBriefing()">
                작전사령부 입장
            </button>
        </section>

        <section id="briefing" class="briefing-zone"></section>

    </main>

    <!-- BGM 제어 패널 -->
    <div class="bgm-control" id="bgmControl">
        <button type="button" class="bgm-button" id="bgmToggle" onclick="toggleBGM()">
            ▶ BGM ON
        </button>

        <button type="button" class="bgm-button" onclick="playPreviousTrack()">
            ◀ PREV
        </button>

        <button type="button" class="bgm-button" onclick="playNextTrack()">
            NEXT ▶
        </button>

        <input
            type="range"
            id="bgmVolume"
            class="bgm-volume"
            min="0"
            max="1"
            step="0.01"
            value="0.25"
            aria-label="BGM 음량 조절"
            oninput="setBGMVolume(this.value)"
        >
    </div>

    <audio id="mainBGM" preload="auto"></audio>

    <div id="popup" class="popup" aria-hidden="true">
        <div class="popup-panel">
            <button class="popup-close" onclick="closePopup()" aria-label="팝업 닫기">
                ✖
            </button>
            <div id="popupContent" class="popup-content"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
